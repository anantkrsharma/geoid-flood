# End-to-end pipeline check for the two-AoI EMSR712 sample (`scripts/get_data.py --sample`).

seed_everything: 0
trainer:
  accelerator: auto
  strategy: auto
  devices: 1
  num_nodes: 1
  precision: bf16-mixed
  logger:
    class_path: TensorBoardLogger
    init_args:
      save_dir: workdir
      name: sample
      version: v1
  callbacks:
    - class_path: lightning.pytorch.callbacks.TQDMProgressBar
      init_args:
        refresh_rate: 1
    - class_path: terratorch.cli_tools.StateDictAwareModelCheckpoint
      init_args:
        save_top_k: 0
        save_last: true

  max_epochs: 1
  limit_train_batches: 4
  limit_val_batches: 0
  num_sanity_val_steps: 0
  limit_test_batches: 4
  log_every_n_steps: 1
  enable_checkpointing: true
  default_root_dir: workdir/sample/v1/

data:
  class_path: geoid_flood.datamodules.geoid.GEOIDFloodDataModule
  init_args:
    root: data/geoid-flood
    batch_size: 2
    num_workers: 0
    train_transform:
      - class_path: albumentations.D4
      - class_path: albumentations.pytorch.ToTensorV2
    val_transform:
      - class_path: albumentations.pytorch.ToTensorV2
    test_transform:
      - class_path: albumentations.pytorch.ToTensorV2
    predict_transform:
      - class_path: albumentations.pytorch.ToTensorV2
    drop_last: false
    no_data_replace: 0.0
    no_label_replace: 255
    modalities:
      - s1grd
    image_scope:
      - pre
      - post
    output_bands:
      - VV
      - VH
    means:
      VV: -12.599
      VH: -20.293
    stds:
      VV: 5.195
      VH: 5.890
    metadata_filename: data_tiles_s256_st128_sample.csv
    max_cloud_cover: 1
    min_positive: 0.0
    min_valid_proportion: 0.01

model:
  class_path: geoid_flood.tasks.flood_segmentation.FloodSegmentationTask
  init_args:
    model_factory: EncoderDecoderFactory
    model_args:
      backbone: timm_convnext_tiny
      backbone_pretrained: false
      backbone_in_chans: 2
      backbone_out_indices: [0, 1, 2, 3]
      decoder: UNetDecoder
      decoder_channels: [512, 256, 128, 64]
      num_classes: 2
      head_dropout: 0.3
    loss: ce
    tiled_inference_parameters:
      h_crop: 256
      h_stride: 128
      w_crop: 256
      w_stride: 128
      average_patches: true
      verbose: true
    ignore_index: 255
    freeze_backbone: false
    freeze_decoder: false
    plot_on_val: false
    tiled_inference_on_validation: false
    tiled_inference_on_testing: false
    optimizer: AdamW
    lr: 5.e-4
    optimizer_hparams:
      weight_decay: 0.01
    lr_overrides:
      encoder: 5.e-5
    scheduler: CosineAnnealingLR
    scheduler_hparams:
      T_max: 1
      eta_min: 1e-6
      last_epoch: -1
