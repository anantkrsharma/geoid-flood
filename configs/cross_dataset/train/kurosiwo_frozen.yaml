seed_everything: 0
trainer:
  accelerator: auto
  strategy: auto
  devices: auto
  num_nodes: 1
  precision: bf16-mixed
  logger:
    class_path: lightning.pytorch.loggers.TensorBoardLogger
    init_args:
      save_dir: workdir/cross_dataset/kurosiwo
      name: frozen_terramind_unet_s1
      version: v1
      log_graph: false
      default_hp_metric: true
      prefix: ''
      comment: ''
      max_queue: 10
      flush_secs: 120
      filename_suffix: ''
  callbacks:
  - class_path: lightning.pytorch.callbacks.EarlyStopping
    init_args:
      monitor: val/IoU_1
      min_delta: 0.0
      patience: 5
      verbose: true
      mode: max
      strict: true
      check_finite: true
      log_rank_zero_only: false
  - class_path: lightning.pytorch.callbacks.TQDMProgressBar
    init_args:
      refresh_rate: 100
      process_position: 0
      leave: false
  - class_path: lightning.pytorch.callbacks.LearningRateMonitor
    init_args:
      logging_interval: epoch
      log_momentum: false
      log_weight_decay: false
  - class_path: terratorch.cli_tools.StateDictAwareModelCheckpoint
    init_args:
      filename: best-{epoch}
      monitor: val/IoU_1
      mode: max
      save_top_k: 1
      save_last: true
  - class_path: terratorch.cli_tools.StateDictAwareModelCheckpoint
    init_args:
      filename: best-{epoch}_state_dict
      monitor: val/IoU_1
      mode: max
      save_top_k: 1
      save_last: false
      save_weights_only: true
  fast_dev_run: false
  max_epochs: 20
  max_steps: -1
  overfit_batches: 0.0
  check_val_every_n_epoch: 1
  log_every_n_steps: 100
  enable_checkpointing: true
  accumulate_grad_batches: 1
  inference_mode: true
  use_distributed_sampler: true
  detect_anomaly: false
  barebones: false
  sync_batchnorm: false
  reload_dataloaders_every_n_epochs: 0
  default_root_dir: workdir/cross_dataset/kurosiwo/frozen_terramind_unet_s1/v1/
model:
  class_path: terratorch.tasks.SemanticSegmentationTask
  init_args:
    model_args:
      backbone: terratorch_terramind_v1_base
      backbone_pretrained: true
      backbone_in_chans: 2
      backbone_modalities:
      - sen1grd
      backbone_bands:
        sen1grd:
        - VV
        - VH
      necks:
      - name: SelectIndices
        indices:
        - 2
        - 5
        - 8
        - 11
      - name: ReshapeTokensToImage
        remove_cls_token: false
      - name: LearnedInterpolateToPyramidal
      decoder: UNetDecoder
      decoder_channels:
      - 512
      - 256
      - 128
      - 64
      num_classes: 2
      head_dropout: 0.3
    model_factory: EncoderDecoderFactory
    loss: ce
    ignore_index: 255
    lr: 5.0e-06
    optimizer: AdamW
    optimizer_hparams:
      weight_decay: 0.1
    scheduler: CosineAnnealingLR
    scheduler_hparams:
      T_max: 20
      eta_min: 1.0e-06
      last_epoch: -1
    freeze_backbone: true
    freeze_decoder: false
    freeze_head: false
    plot_on_val: true
    tiled_inference_parameters:
      h_crop: 224
      h_stride: 144
      w_crop: 224
      w_stride: 144
      average_patches: true
      verbose: true
    output_on_inference: prediction
    output_most_probable: true
    tiled_inference_on_testing: false
    tiled_inference_on_validation: false
data:
  class_path: geoid_flood.datamodules.kurosiwo.KuroSiwoDataModule
  init_args:
    root: data/flood-datasets/KuroSiwo
    grids: resources/kurosiwo_grids.json.gz
    batch_size: 64
    num_workers: 0
    times:
      - SL1
      - MS1
    input_sources:
      - SHUB_RTC
    output_sources:
      - SHUB_RTC
    dataset_bands:
      - VV
      - VH
    output_bands:
      - VV
      - VH
    no_data_replace: 0.0
    no_label_replace: 255
    apply_erosion: false
    means:
      VV: -12.599
      VH: -20.293
    stds:
      VV: 5.195
      VH: 5.890
    train_transform:
      - class_path: albumentations.D4
        init_args:
          p: 1.0
      - class_path: albumentations.pytorch.ToTensorV2
        init_args:
          transpose_mask: false
          p: 1.0
    val_transform:
      - class_path: albumentations.pytorch.ToTensorV2
        init_args:
          transpose_mask: false
          p: 1.0
    test_transform:
      - class_path: albumentations.pytorch.ToTensorV2
        init_args:
          transpose_mask: false
          p: 1.0
    predict_transform:
      - class_path: albumentations.pytorch.ToTensorV2
        init_args:
          transpose_mask: false
          p: 1.0
out_dtype: int16
deploy_config_file: true
