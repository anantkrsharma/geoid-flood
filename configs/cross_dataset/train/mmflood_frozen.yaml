seed_everything: 0
trainer:
  accelerator: auto
  strategy: auto
  devices: auto
  num_nodes: 1
  precision: bf16-mixed
  logger:
    class_path: TensorBoardLogger
    init_args:
      save_dir: workdir/cross_dataset/mmflood
      name: frozen_terramind_base_unet_s1grd
      version: v1
  callbacks:
    - class_path: lightning.pytorch.callbacks.EarlyStopping
      init_args:
        monitor: val/IoU_1
        mode: max
        patience: 5
        strict: true
        verbose: true
    - class_path: lightning.pytorch.callbacks.TQDMProgressBar
      init_args:
        refresh_rate: 100
    - class_path: LearningRateMonitor
      init_args:
        logging_interval: epoch
    - class_path: terratorch.cli_tools.StateDictAwareModelCheckpoint
      init_args:
        filename: best-{epoch}
        monitor: val/IoU_1
        mode: max
        save_top_k: 1
        save_last: true
    - class_path: terratorch.cli_tools.StateDictAwareModelCheckpoint
      init_args:
        filename: best-{epoch}_state_dict
        monitor: val/IoU_1
        mode: max
        save_top_k: 1
        save_last: false
        save_weights_only: true

  max_epochs: 20
  check_val_every_n_epoch: 1
  log_every_n_steps: 100
  enable_checkpointing: true
  default_root_dir: workdir/cross_dataset/mmflood/frozen_terramind_base_unet_s1grd/v1/

data:
  class_path: geoid_flood.datamodules.mmflood.MMFloodDataModule
  init_args:
    root: data/flood-datasets/mmflood
    batch_size: 32
    num_workers: 0
    train_transform:
      - class_path: albumentations.PadIfNeeded
        init_args:
          min_height: 256
          min_width: 256
      - class_path: albumentations.RandomCrop
        init_args:
          height: 256
          width: 256
      - class_path: albumentations.D4
      - class_path: albumentations.pytorch.ToTensorV2
    val_transform:
      - class_path: albumentations.pytorch.ToTensorV2
    test_transform:
      - class_path: albumentations.pytorch.ToTensorV2
    predict_transform:
      - class_path: albumentations.pytorch.ToTensorV2
    drop_last: true
    no_data_replace: 0.0
    no_label_replace: 255
    input_sources:
      - s1grd
    output_sources:
      - s1grd
    dataset_bands:
      - VV
      - VH
    output_bands:
      - VV
      - VH
    means:
      VV: -12.599
      VH: -20.293
    stds:
      VV: 5.195
      VH: 5.890

model:
  class_path: terratorch.tasks.SemanticSegmentationTask
  init_args:
    model_factory: EncoderDecoderFactory
    model_args:
      backbone: terratorch_terramind_v1_base
      backbone_pretrained: true
      backbone_in_chans: 2
      backbone_modalities:
        - sen1grd
      backbone_bands:
        sen1grd:
          - VV
          - VH
      necks:
        - name: SelectIndices
          indices: [2, 5, 8, 11]
        - name: ReshapeTokensToImage
          remove_cls_token: false
        - name: LearnedInterpolateToPyramidal

      decoder: UNetDecoder
      decoder_channels: [512, 256, 128, 64]
      num_classes: 2
      head_dropout: 0.3
    loss: ce
    tiled_inference_parameters:
      h_crop: 256
      h_stride: 128
      w_crop: 256
      w_stride: 128
      average_patches: true
      verbose: true
    ignore_index: 255
    freeze_backbone: true
    freeze_decoder: false
    plot_on_val: false
    tiled_inference_on_validation: true
    tiled_inference_on_testing: true
    optimizer: AdamW
    lr: 5.e-6
    optimizer_hparams:
      weight_decay: 0.1
    scheduler: CosineAnnealingLR
    scheduler_hparams:
      T_max: 20
      eta_min: 1e-6
      last_epoch: -1
